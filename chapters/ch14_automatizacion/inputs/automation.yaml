# Automatización del informe semanal de ventas por región (los 6 pasos del capítulo).

# Paso 1: objetivos
goals:
  achieve: "Que los directores regionales tengan cada lunes a las 9:00 la venta neta de su región, con la misma cifra que el comité."
  keep: "El formato del informe que ya conocen las regiones."
  challenges: "Se monta a mano con exportaciones de cada tienda y del e-commerce; tarda, tiene errores y no cuadra con la cifra oficial."
  success: "Informe automático, a tiempo todas las semanas, que cuadra al céntimo con curated.agg_sales_daily_channel."

# Paso 2: proceso actual (manual), con los minutos que cuesta cada semana
current_process:
  frequency_per_year: 52
  people: Analistas de control de gestión regional
  steps:
    - {step: Exportar las ventas de cada tienda desde el POS, minutes: 90, manual: true, error_prone: true}
    - {step: Exportar los pedidos online, minutes: 20, manual: true, error_prone: false}
    - {step: Asignar cada tienda y cada código postal a su región, minutes: 120, manual: true, error_prone: true}
    - {step: Quitar a mano cancelaciones y devoluciones, minutes: 45, manual: true, error_prone: true}
    - {step: Sumar y cuadrar con la cifra de Finanzas, minutes: 150, manual: true, error_prone: true}
    - {step: Enviar el informe por email, minutes: 15, manual: true, error_prone: false}

# Paso 3: enunciado del problema acordado
problem_statement: >-
  Cada semana se dedican unas 7 horas a montar a mano un informe regional que no cuadra con la
  cifra oficial de ventas, porque cada analista aplica sus propias reglas de región y de
  exclusión de cancelaciones.

# Paso 4: enfoques y ROI (fórmula del libro). Horas al año y coste por hora del personal.
cost_per_hour: 45
approaches:
  A:
    name: "A: pipeline automático con monitorización y alertas"
    capabilities: [Integración de datos, Monitorización y alertas]
    automated_steps: [0, 1, 3]          # índices de los pasos del proceso que desaparecen
    maintain_hours_per_year: 40
    build_hours: 60
  B:
    name: "B: A + asignación automática de región (datos de referencia)"
    capabilities: [Integración de datos, Monitorización y alertas, Transformación de datos]
    automated_steps: [0, 1, 2, 3]
    maintain_hours_per_year: 60
    build_hours: 100
  C:
    name: "C: B + cuadre y envío automáticos del informe"
    capabilities: [Integración de datos, Monitorización y alertas, Transformación de datos, Análisis e informes automáticos]
    automated_steps: [0, 1, 2, 3, 4, 5]
    maintain_hours_per_year: 80
    build_hours: 160
chosen: C
horizon_years: 3

# Paso 5-6: monitorización (umbrales de las alertas)
monitoring:
  window_weeks: 8           # semanas anteriores con las que se compara cada semana
  z_threshold: 2            # alerta si la venta cae más de z desviaciones típicas bajo la media
  max_unmapped_share: 0.02  # ventas online cuyo código postal no se puede asignar a una región
  allow_negative_lines: false

# Enriquecimiento de terceros: dos proveedores de normalización de direcciones (simulados)
# coverage: parte de las direcciones inválidas que devuelven; accuracy: parte de las devueltas
# que son correctas; price: US$ por registro consultado
vendors:
  - {name: DirecPostal, coverage: 0.95, accuracy: 0.70, price: 0.05}
  - {name: GeoCalidad, coverage: 0.80, accuracy: 0.97, price: 0.09}
vendor_seed: 7
revenue_per_fixed_order: 2.5   # US$/año por pedido con dirección corregida (menos devoluciones y reenvíos)
